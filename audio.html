<!doctype html>
<html lang="eu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Ahots-oharra</title>

  <meta name="robots" content="noindex,nofollow">

  <link rel="stylesheet" href="./css/styles.css">
</head>

<body>

  <main class="card audio-card">

    <div class="icon">
      🎧
    </div>

    <h1 id="saludo">
      Kaixo:
    </h1>

    <p
      id="mensajeAudio"
      class="audio-message"
    >
      Zure irakasleak ahots-ohar bat bidali dizu...
    </p>

    <p
      class="escuchar"
      data-i18n="listenHere"
    >
      Entzun hemen.
    </p>

    <iframe
      id="player"
      class="player"
      title="Ahots-oharra"
      allow="autoplay">
    </iframe>

    <div
      id="error"
      class="error"
      data-i18n="audioError"
    >
      Ezin izan da audioa aurkitu.
    </div>

  </main>

  <script src="./js/i18n.js"></script>
  <script src="./js/audio.js"></script>

</body>
</html>
