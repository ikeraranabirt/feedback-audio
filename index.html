<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Generador de notas de voz</title>

  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #172033;
      --muted: #687386;
      --border: #e4e8f0;
      --accent: #2563eb;
      --success-bg: #ecfdf5;
      --success-border: #a7f3d0;
      --success-text: #065f46;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
    }

    .card {
      width: min(620px, 100%);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 12px 35px rgba(15, 23, 42, .08);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.8rem;
    }

    .intro {
      margin: 0 0 24px;
      color: var(--muted);
      line-height: 1.5;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font: inherit;
      color: var(--text);
      background: white;
    }

    input:focus {
      outline: 2px solid #bfdbfe;
      border-color: var(--accent);
    }

    button {
      width: 100%;
      padding: 12px 16px;
      border: 0;
      border-radius: 10px;
      background: var(--accent);
      color: white;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      filter: brightness(.96);
    }

    .resultado {
      display: none;
      margin-top: 24px;
      padding: 18px;
      border: 1px solid var(--success-border);
      border-radius: 12px;
      background: var(--success-bg);
    }

    .resultado h2 {
      margin: 0 0 10px;
      font-size: 1rem;
      color: var(--success-text);
    }

    .resultado input {
      margin-bottom: 10px;
      background: white;
    }

    .mensaje {
      min-height: 1.4em;
      margin-top: 10px;
      color: var(--success-text);
      font-size: .9rem;
    }
  </style>
</head>

<body>

  <main class="card">

    <h1>Generador de notas de voz</h1>

    <p class="intro">
      Introduce tus datos y el enlace de la grabación de Vocaroo.
    </p>

    <form id="form">

      <div class="field">
        <label for="nombre">Nombre del profesor</label>
        <input
          type="text"
          id="nombre"
          name="nombre"
          placeholder="Ej. Iker"
          required
        >
      </div>

      <div class="field">
        <label for="modulo">Módulo</label>
        <input
          type="text"
          id="modulo"
          name="modulo"
          placeholder="Ej. DWEC"
          required
        >
      </div>

      <div class="field">
        <label for="vocaroo">Enlace de Vocaroo</label>
        <input
          type="url"
          id="vocaroo"
          name="vocaroo"
          placeholder="https://voca.ro/15inrlPfVT7C"
          required
        >
      </div>

      <button type="submit">
        Generar enlace
      </button>

    </form>

    <section id="resultado" class="resultado">
      <h2>Enlace generado</h2>

      <input
        type="text"
        id="enlaceGenerado"
        readonly
      >

      <button type="button" id="copiar">
        Copiar enlace
      </button>

      <div id="mensaje" class="mensaje"></div>
    </section>

  </main>

  <script>
    const form = document.getElementById("form");
    const resultado = document.getElementById("resultado");
    const enlaceGenerado = document.getElementById("enlaceGenerado");
    const copiar = document.getElementById("copiar");
    const mensaje = document.getElementById("mensaje");

    form.addEventListener("submit", function (event) {
      event.preventDefault();

      const nombre = document.getElementById("nombre").value.trim();
      const modulo = document.getElementById("modulo").value.trim();
      const vocaroo = document.getElementById("vocaroo").value.trim();

      const match = vocaroo.match(
        /(?:voca\.ro|vocaroo\.com)\/(?:embed\/)?([A-Za-z0-9]+)/i
      );

      if (!match) {
        alert("Introduce un enlace válido de Vocaroo.");
        return;
      }

      const id = match[1];

      const url = new URL("audio.html", window.location.href);

      url.searchParams.set("id", id);
      url.searchParams.set("nombre", nombre);
      url.searchParams.set("modulo", modulo);

      enlaceGenerado.value = url.toString();
      resultado.style.display = "block";
      mensaje.textContent = "";
    });

    copiar.addEventListener("click", async function () {
      try {
        await navigator.clipboard.writeText(enlaceGenerado.value);

        mensaje.textContent = "Enlace copiado al portapapeles.";
      } catch (error) {
        enlaceGenerado.select();
        document.execCommand("copy");

        mensaje.textContent = "Enlace copiado al portapapeles.";
      }
    });
  </script>

</body>
</html>
