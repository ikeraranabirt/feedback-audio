<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Generador de notas de voz</title>

  <link rel="stylesheet" href="./css/styles.css">
</head>

<body>

  <main class="card">

    <h1>Generador de notas de voz</h1>

    <p class="intro">
      Introduce los datos y el enlace de la grabación de Vocaroo.
    </p>

    <form id="form">

      <div class="field">
        <label for="nombre">Nombre del profesor</label>

        <input
          type="text"
          id="nombre"
          name="nombre"
          placeholder="Ej. Iker"
          required
        >
      </div>

      <div class="field">
        <label for="alumno">Nombre del alumno</label>

        <input
          type="text"
          id="alumno"
          name="alumno"
          placeholder="Ej. Ane"
          required
        >
      </div>

      <div class="field">
        <label for="modulo">Módulo</label>

        <input
          type="text"
          id="modulo"
          name="modulo"
          placeholder="Ej. DWEC"
          required
        >
      </div>

      <div class="field">
        <label for="vocaroo">Enlace de Vocaroo</label>

        <input
          type="url"
          id="vocaroo"
          name="vocaroo"
          placeholder="https://voca.ro/15inrlPfVT7C"
          required
        >
      </div>

      <button
        type="submit"
        class="btn-primary"
      >
        Generar enlace
      </button>

    </form>

    <section class="resultado">

      <h2>Resultado</h2>

      <p class="resultado-texto">
        Genera primero el enlace. Después podrás comprobar el resultado
        y copiar el enlace que enviarás al alumno.
      </p>

      <div class="acciones">

        <button
          type="button"
          id="verResultado"
          class="btn-secondary"
          disabled
        >
          Ver resultado
        </button>

        <button
          type="button"
          id="copiar"
          class="btn-primary"
          disabled
        >
          Copiar enlace para el alumno
        </button>

      </div>

      <div id="mensaje" class="mensaje">
        Enlace copiado al portapapeles.
      </div>

    </section>

  </main>

  <script src="./js/generator.js"></script>

</body>
</html>
