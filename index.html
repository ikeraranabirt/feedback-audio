<!doctype html>
<html lang="eu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Ahots-oharren sortzailea</title>

  <link rel="stylesheet" href="./css/styles.css">
</head>

<body>

  <main class="card">

    <header class="page-header">

      <div class="header-content">

        <h1 data-i18n="generatorTitle">
          Ahots-oharren sortzailea
        </h1>

        <p
          class="intro"
          data-i18n="generatorIntro"
        >
          Sartu datuak eta Vocaroo grabazioaren esteka.
        </p>

      </div>

      <div
        class="language-selector"
        aria-label="Idioma"
      >

        <button
          type="button"
          class="language-button active"
          data-lang="eu"
        >
          EUS
        </button>

        <button
          type="button"
          class="language-button"
          data-lang="es"
        >
          ES
        </button>

      </div>

    </header>


    <form id="form">

      <div class="field">

        <label
          for="nombre"
          data-i18n="teacherName"
        >
          Irakaslearen izena
        </label>

        <input
          type="text"
          id="nombre"
          name="nombre"
          data-i18n-placeholder="teacherPlaceholder"
          placeholder="Adib. Iker"
          required
        >

      </div>


      <div class="field">

        <label
          for="alumno"
          data-i18n="studentName"
        >
          Ikaslearen izena
        </label>

        <input
          type="text"
          id="alumno"
          name="alumno"
          data-i18n-placeholder="studentPlaceholder"
          placeholder="Adib. Ane"
          required
        >

      </div>


      <div class="field">

        <label
          for="modulo"
          data-i18n="module"
        >
          Modulua
        </label>

        <input
          type="text"
          id="modulo"
          name="modulo"
          data-i18n-placeholder="modulePlaceholder"
          placeholder="Adib. DWEC"
          required
        >

      </div>


      <section class="recorder">

        <h2>
          Ahots-oharra grabatu
        </h2>

        <div class="recorder-actions">

          <button
            type="button"
            id="grabar"
            class="btn-primary"
          >
            🎙 Grabatu
          </button>

          <button
            type="button"
            id="detener"
            class="btn-secondary"
            disabled
          >
            ⏹ Gelditu
          </button>

        </div>

        <p id="estadoGrabacion">
          Grabatzeko prest.
        </p>

        <audio
          id="audioPreview"
          controls
          hidden
        ></audio>

        <button
          type="button"
          id="subirAudio"
          class="btn-primary"
          disabled
        >
          ☁ Audioa igo
      </button>

      </section>


      <div class="field">

        <label
          for="vocaroo"
          data-i18n="vocarooLink"
        >
          Vocaroo esteka
        </label>

        <input
          type="url"
          id="vocaroo"
          name="vocaroo"
          placeholder="https://voca.ro/15inrlPfVT7C"
          required
        >

      </div>


      <button
        type="submit"
        class="btn-primary"
        data-i18n="generateLink"
      >
        Esteka sortu
      </button>

    </form>


    <section class="resultado">

      <h2 data-i18n="resultTitle">
        Emaitza
      </h2>

      <p
        class="resultado-texto"
        data-i18n="resultHelp"
      >
        Sortu esteka lehenik. Ondoren emaitza egiaztatu edo
        ikaslearentzako esteka kopiatu ahal izango duzu.
      </p>


      <div class="acciones">

        <button
          type="button"
          id="verResultado"
          class="btn-secondary"
          data-i18n="viewResult"
          disabled
        >
          Emaitza ikusi
        </button>

        <button
          type="button"
          id="copiar"
          class="btn-primary"
          data-i18n="copyStudentLink"
          disabled
        >
          Ikaslearentzako esteka kopiatu
        </button>

      </div>


      <div
        id="mensaje"
        class="mensaje"
        data-i18n="copied"
      >
        Esteka arbelean kopiatu da.
      </div>

    </section>

  </main>


<script src="./js/i18n.js"></script>
<script src="./js/recorder.js"></script>
<script src="./js/generator.js"></script>


</body>
</html>
